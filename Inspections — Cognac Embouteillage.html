<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspections — Cognac Embouteillage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECE8; --surface:#F7F8F5; --surface2:#EEF1EC; --ink:#26302B; --muted:#56605A; --line:#D3D9D3;
  --accent:#8A4716; --accent-ink:#FFF7EE; --amber:#E0892F; --amber-d:#B8581A; --cork:#2B2320; --scarf:#C8262C; --scarf-d:#96161C;
  --mint:#DCE8D6; --mint-ink:#35602B; --butter:#ECE3C3; --butter-ink:#65520E; --rose:#F0D8D2; --rose-ink:#8F352D;
  --lilac:#DDE3EC; --lilac-ink:#36507A; --sky:#D5E7E6; --sky-ink:#22605D; --peach:#EFDFCB; --peach-ink:#81461A;
  --focus:#36507A; --shadow:0 1px 2px rgba(38,48,43,.07);
  --r-lg:18px; --r-md:13px; --r-sm:9px;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C211F; --surface:#242A27; --surface2:#2B322E; --ink:#E3E8E3; --muted:#A3ADA6; --line:#39413C;
  --accent:#D9934A; --accent-ink:#1C211F; --amber:#E0892F; --amber-d:#A9521A; --cork:#0F0C0B; --scarf:#D4363A; --scarf-d:#A0222A;
  --mint:#2A3A26; --mint-ink:#B9D9AC; --butter:#3A3421; --butter-ink:#E5D38E; --rose:#432A27; --rose-ink:#F0B3AA;
  --lilac:#2C3648; --lilac-ink:#B9C8E6; --sky:#213A39; --sky-ink:#A5D6D2; --peach:#3E2E1F; --peach-ink:#EDC49B;
  --focus:#B9C8E6; --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#1C211F; --surface:#242A27; --surface2:#2B322E; --ink:#E3E8E3; --muted:#A3ADA6; --line:#39413C;
  --accent:#D9934A; --accent-ink:#1C211F; --amber:#E0892F; --amber-d:#A9521A; --cork:#0F0C0B; --scarf:#D4363A; --scarf-d:#A0222A;
  --mint:#2A3A26; --mint-ink:#B9D9AC; --butter:#3A3421; --butter-ink:#E5D38E; --rose:#432A27; --rose-ink:#F0B3AA;
  --lilac:#2C3648; --lilac-ink:#B9C8E6; --sky:#213A39; --sky-ink:#A5D6D2; --peach:#3E2E1F; --peach-ink:#EDC49B;
  --focus:#B9C8E6; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--font);margin:0;line-height:1.2}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:58px}
.bar h1{font-size:19px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--lilac);color:var(--lilac-ink);white-space:nowrap}

/* home */
.hero{padding:28px 4px 18px}
.hero h2{font-size:clamp(30px,7vw,44px);font-weight:800;line-height:1.02}
.hero p{color:var(--muted);margin:10px 0 0;max-width:46ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
.input,textarea.input{width:100%;padding:12px 14px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface2);outline:none;transition:border-color .15s}
.input:focus{border-color:var(--focus)}
textarea.input{resize:vertical;min-height:46px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:var(--r-md);border:0;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);min-height:50px}
.btn.soft{background:var(--lilac);color:var(--lilac-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn svg{width:19px;height:19px}
.btn:disabled{opacity:.5;cursor:default}
.section-title{font-size:15px;font-weight:700;color:var(--muted);margin:30px 4px 10px}
.hist{display:flex;flex-direction:column;gap:8px}
.hist-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.hist-item .meta{flex:1;min-width:0}
.hist-item b{display:block}
.hist-item small{color:var(--muted)}
.note-chip{font-family:var(--font);font-weight:700;font-size:17px;padding:4px 10px;border-radius:10px;min-width:58px;text-align:center}
.lvl-good{background:var(--mint);color:var(--mint-ink)}
.lvl-mid{background:var(--butter);color:var(--butter-ink)}
.lvl-bad{background:var(--rose);color:var(--rose-ink)}
.lvl-none{background:var(--surface2);color:var(--muted)}
.empty{color:var(--muted);padding:14px 4px}

/* zones grid */
.overview{display:flex;align-items:flex-end;gap:18px;padding:22px 4px 8px}
.overview .big{font-family:var(--font);font-size:64px;font-weight:800;line-height:.9}
.overview .big small{font-size:22px;color:var(--muted);font-weight:600}
.overview .txt{color:var(--muted);padding-bottom:6px}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px}
.zone-card{position:relative;text-align:left;border:0;border-radius:var(--r-lg);padding:14px 14px 12px;background:var(--zc);color:var(--zi);display:flex;gap:10px;align-items:stretch;min-height:132px}
.zone-card .zt{display:flex;flex-direction:column;justify-content:space-between;flex:1;min-width:0}
.zone-card h3{font-size:18px;font-weight:700}
.zone-card .prog{font-size:13px;font-weight:600;opacity:.85}
.zone-card .zn{font-family:var(--font);font-size:28px;font-weight:800;line-height:1}
.zone-card .zn small{font-size:13px;font-weight:600;opacity:.7}
.zone-card .cam{font-size:12px;font-weight:600;opacity:.8}

/* bottle gauge — the signature element */
.bottle{width:44px;flex:none;align-self:flex-end}
.bottle svg{width:100%;height:auto;display:block}
.bottle .glass{fill:color-mix(in srgb,var(--surface) 70%,transparent);stroke:none}
.bottle .glass-line{fill:none;stroke:currentColor;stroke-width:2;stroke-opacity:.75}
.bottle .liquid{transition:y .6s cubic-bezier(.2,.8,.2,1),height .6s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.bottle .liquid{transition:none}}

/* zone view */
.zone-head{display:flex;align-items:center;gap:16px;padding:22px 18px;margin:16px 0 6px;border-radius:var(--r-lg);background:var(--zc);color:var(--zi)}
.zone-head .bottle{width:60px}
.zone-head h2{font-size:28px;font-weight:800}
.zone-head .sub{font-weight:600;opacity:.85;font-size:14px;margin-top:4px}
.zone-head .zn{margin-left:auto;font-family:var(--font);font-size:40px;font-weight:800;line-height:1;text-align:right}
.zone-head .zn small{display:block;font-size:13px;font-weight:600;opacity:.7}
.group{margin-top:22px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 8px}
.group-h h3{font-size:21px;font-weight:700}
.sec-h{font-size:14px;font-weight:700;color:var(--muted);padding:12px 4px 6px}
.items{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 12px 10px}
.item.done{border-color:color-mix(in srgb,var(--zi) 30%,var(--line))}
.item .q{font-weight:600;font-size:17px;line-height:1.35;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
.item .q span{flex:1}
.item .tag{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;padding-top:2px}
.choices{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ch{min-width:44px;height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700;font-size:16px;transition:transform .08s}
.ch:active{transform:scale(.94)}
.ch.on.v0,.ch.on.v1,.ch.on.non{background:var(--rose);color:var(--rose-ink);border-color:transparent}
.ch.on.v2,.ch.on.v3{background:var(--butter);color:var(--butter-ink);border-color:transparent}
.ch.on.v4,.ch.on.v5,.ch.on.oui{background:var(--mint);color:var(--mint-ink);border-color:transparent}
.ch.on.na{background:var(--lilac);color:var(--lilac-ink);border-color:transparent}
.ch{flex:1 1 0;min-width:0;padding:0 4px}
.ch.na{flex:0 0 auto;font-size:13px;padding:0 10px;margin-left:4px}
.ch.yn{max-width:140px}
.tools{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;border:1px dashed var(--line);background:transparent;font-size:14px;font-weight:600;color:var(--muted)}
.tool svg{width:17px;height:17px}
.tool.has{border-style:solid;color:var(--ink)}
.cmt{margin-top:8px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumb{width:64px;height:64px;border-radius:10px;overflow:hidden;border:0;padding:0;background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.zone-notes{margin-top:28px}
.obs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.zone-nav{display:flex;gap:10px;margin-top:26px}
.zone-nav .btn{flex:1}

/* bilan */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
th{font-size:13px;color:var(--muted);font-weight:700;background:var(--surface2)}
tr:last-child td{border-bottom:0}
.sub-row td{color:var(--muted);font-size:14px;padding-top:4px;padding-bottom:4px;border-bottom:0}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.warn{background:var(--butter);color:var(--butter-ink);border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin-top:14px}

/* fixed bottom action */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock-in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1;box-shadow:var(--shadow)}

/* viewer + toast */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(20,18,30,.92);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vbar{display:flex;gap:10px;justify-content:space-between;margin-bottom:10px}
.viewer .btn{background:#fff;color:#2B2940}
.viewer .btn.del{background:#F8D3D1;color:#9B3833}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* logo Cognac Embouteillage */
.brand{height:44px;width:auto;flex:none;background:#fff;border-radius:10px;padding:3px 5px;border:1px solid var(--line);display:block}
.hero-top{display:flex;align-items:center;gap:18px}
.hero-top>div{flex:1;min-width:0}
.hero-logo{height:118px;width:auto;flex:none;background:#fff;border-radius:16px;padding:8px 10px;border:1px solid var(--line);box-shadow:var(--shadow)}
@media (max-width:480px){.hero-logo{height:88px}.hero-top{gap:12px}}
/* plan d'action */
.plan-entry{width:100%;margin-top:14px;display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:var(--r-lg);padding:16px 18px;background:var(--peach);color:var(--peach-ink)}
.plan-entry>div:first-child{flex:1;min-width:0}
.plan-entry h3{font-size:21px;font-weight:800}
.plan-entry span{font-size:14px;font-weight:600;opacity:.9}
.pdca{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.pd{height:34px;min-width:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface2);color:var(--muted);font-weight:800;font-size:15px;padding:0;display:flex;align-items:center;justify-content:center}
.pd.on{border-color:transparent}
.pd-P.on{background:var(--sky);color:var(--sky-ink)} .pd-D.on{background:var(--butter);color:var(--butter-ink)}
.pd-C.on{background:var(--lilac);color:var(--lilac-ink)} .pd-A.on{background:var(--mint);color:var(--mint-ink)}
.pd:disabled{cursor:default}
.pdca.mini{width:132px;flex:none} .pdca.mini .pd{height:30px;min-width:0;border:0}
.pdca.big{gap:8px} .pdca.big .pd{height:auto;min-height:92px;flex-direction:column;gap:2px;padding:10px 6px;border-radius:14px}
.pdca.big .pd b{font-size:26px;font-family:var(--font);line-height:1}
.pdca.big .pd span{font-size:14px;font-weight:700} .pdca.big .pd small{font-size:11px;font-weight:500;line-height:1.25;opacity:.85}
@media (max-width:480px){.pdca.big .pd small{display:none}.pdca.big .pd{min-height:72px}}
.plan-tools{display:flex;flex-direction:column;gap:10px;margin:10px 0 14px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:38px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.fchip span{color:var(--muted);font-weight:600;margin-left:2px}
.fchip.on{background:var(--ink);color:var(--bg);border-color:transparent} .fchip.on span{color:inherit;opacity:.7}
.plan-row2{display:flex;gap:8px;align-items:center}
.sel{padding:9px 12px;height:42px}
.plan-row2 .sel{flex:1;min-width:0}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex:none;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 14px;height:39px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--lilac);color:var(--lilac-ink)}
.acts{display:flex;flex-direction:column;gap:10px}
.act-card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--zc);border-radius:var(--r-md);overflow:hidden}
.act-main{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px 8px}
.act-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.num{font-family:var(--font);font-weight:800;font-size:17px}
.zpill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--zc);color:var(--zi)}
.theme{font-size:13px;color:var(--muted);font-weight:600}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;margin-left:auto;white-space:nowrap}
.act-sujet{font-size:16px} .act-sujet i{color:var(--muted);font-weight:500}
.act-ac{color:var(--muted);font-size:14px}
.act-foot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 150px;gap:8px 10px;align-items:end;padding:8px 14px 12px;border-top:1px dashed var(--line)}
@media (max-width:600px){.act-foot{grid-template-columns:1fr 1fr}.act-foot .pdca{grid-column:1/-1}}
.meta-s{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta-s small{display:block;font-size:11px;color:var(--muted);font-weight:600;}
.late,.late-t{color:var(--rose-ink)}
td.late{background:var(--rose);font-weight:700}
.act-tbl{min-width:1080px}
.act-tbl td{font-size:14px}
.act-tbl tbody tr{cursor:pointer}
.act-tbl tbody tr:hover td{background:var(--surface2)}
.act-tbl td.wide{min-width:190px;max-width:280px;white-space:pre-wrap}
.act-tbl .pdc{width:44px;padding:6px 3px;text-align:center}
.act-tbl .pd{width:34px;height:32px;margin:0 auto}
.wide .wrap,.wide .bar-in,.wide .dock-in{max-width:1320px}
.legend{color:var(--muted);font-size:13px;margin:14px 4px 0}
.num-big{font-family:var(--font);font-size:30px;font-weight:800;padding-right:6px;border-right:2px solid currentColor;opacity:.9}
.auto-h{font-size:12px;font-weight:700;;color:var(--muted);margin-bottom:10px}
.autos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.autos{grid-template-columns:1fr 1fr}}
.auto{background:var(--surface2);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
.auto small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.auto b{display:block;overflow:hidden;text-overflow:ellipsis}
.auto .sel{margin-top:2px;height:36px;padding:4px 8px;background:var(--surface)}
.origin{margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--rose);color:var(--rose-ink)}
.origin small{display:block;font-weight:600;font-size:12px;margin-bottom:2px}
.origin p{margin:4px 0 0;font-size:14px}
.origin .note-chip{background:color-mix(in srgb,var(--surface) 60%,transparent);padding:1px 8px;margin-left:4px}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(20,18,30,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--surface);color:var(--ink);border-radius:var(--r-lg);padding:20px;max-width:400px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal-box h3{font-size:20px;font-weight:800} .modal-box p{color:var(--muted);margin:8px 0 0}
.modal-btns{display:flex;gap:10px;margin-top:18px} .modal-btns .btn{flex:1}
.del-btn{background:var(--rose);color:var(--rose-ink)}
.eff{margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--butter);color:var(--butter-ink);display:flex;flex-direction:column;gap:4px}
.eff.no{background:var(--rose);color:var(--rose-ink)}
.eff.ok{background:var(--mint);color:var(--mint-ink)}
.eff small{font-size:13px;opacity:.95}
.eff-q{font-weight:700;margin-top:4px}
.eff-btns{display:flex;gap:6px}
.eff-btns .ch{background:var(--surface);max-width:140px}
.eff-btns .ch.on.non{background:var(--rose-ink);color:var(--surface)}
.lnk{border:0;background:none;padding:0;font:inherit;color:inherit;font-weight:700;text-decoration:underline}
.kpi-entry{margin-top:10px;background:var(--sky);color:var(--sky-ink)}
.mods{display:flex;flex-direction:column;gap:12px}

function buildZones(raw){ return raw.map(z=>({ ...z, groups: z.groups.map(([gname,list],gi)=>{
  const items=[]; let sec=null; let ii=0;
  list.forEach(s=>{ if(typeof s==='string'&&s.startsWith('# ')){ sec=s.slice(2); return; }
    if(Array.isArray(s)){ items.push({ key:`${z.id}.${gi}.${ii++}`, label:s[0], bv:true, mat:s[1], cp:!!s[2], sec }); return; }
    const yn=s.startsWith('?'); items.push({ key:`${z.id}.${gi}.${ii++}`, label: yn?s.slice(1):s, yn, sec }); });
  return { name:gname, items };
})})); }

function points(item, a){ if(!a||a.v==null||a.v==='na') return null; if(item.bv) return a.v==='oui'?5:a.v==='non'?0:null; if(item.yn) return a.v==='oui'?5:0; return Number(a.v); }
function groupScore(g, ans){ let s=0,n=0; g.items.forEach(it=>{ const p=points(it,ans[it.key]); if(p!=null){s+=p;n++;} }); return n? {note:s/(n*5)*20, pts:s, max:n*5, n} : {note:null, pts:0, max:0, n:0}; }
function zoneScore(z, ans){ const gs=z.groups.map(g=>groupScore(g,ans)); const v=gs.filter(g=>g.note!=null); return { groups:gs, note: v.length? v.reduce((a,g)=>a+g.note,0)/v.length : null }; }
function globalScore(ans){ const zs=ZONES.map(z=>zoneScore(z,ans)); const v=zs.filter(z=>z.note!=null); return { zones:zs, note: v.length? v.reduce((a,z)=>a+z.note,0)/v.length : null }; }
function progress(z, ans){ let t=0,d=0; z.groups.forEach(g=>g.items.forEach(it=>{ t++; const a=ans[it.key]; if(a&&a.v!=null) d++; })); return {t,d}; }
function lvl(n){ const t=MOD.lv||[16,12]; return n==null?'none': n>=t[0]-1e-9?'good': n>=t[1]?'mid':'bad'; }

function answerLabel(it,a){ if(!a||a.v==null) return ''; if(a.v==='na') return 'N/A'; if(it.bv) return {oui:'Intact',non:'Non intact',abs:'Absent'}[a.v]||''; if(it.yn) return a.v==='oui'?'Oui':'Non'; return String(a.v).replace('.',','); }

const mem={ insp:new Map(), photos:new Map(), act:new Map(), inc:new Map(), outbox:new Map() }; let idb=null;
function upgradeStores(d){ const has=n=>d.objectStoreNames.contains(n); if(!has('insp')) d.createObjectStore('insp',{keyPath:'id'}); if(!has('photos')){ const p=d.createObjectStore('photos',{keyPath:'id'}); p.createIndex('insp','inspId'); } if(!has('act')) d.createObjectStore('act',{keyPath:'id'}); if(!has('inc')) d.createObjectStore('inc',{keyPath:'id'}); if(!has('outbox')) d.createObjectStore('outbox',{keyPath:'k'}); }
function openDB(){ return new Promise(res=>{ try{ const r=indexedDB.open(MOD.idb,4);
  r.onupgradeneeded=()=>upgradeStores(r.result);
  r.onsuccess=()=>{ idb=r.result; res(); }; r.onerror=()=>res(); }catch(e){ res(); } }); }
function tx(store,mode,fn){ return new Promise((res,rej)=>{ if(!idb){ res(fn(null)); return; } try{ const t=idb.transaction(store,mode); const s=t.objectStore(store); const out=fn(s); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out); t.onerror=()=>rej(t.error); }catch(e){ rej(e); } }); }
const LocalDB={
  async put(store,obj){ if(!idb){ mem[store].set(obj.id,obj); return; } return tx(store,'readwrite',s=>s.put(obj)); },
  async get(store,id){ if(!idb) return mem[store].get(id); return tx(store,'readonly',s=>s.get(id)); },
  async del(store,id){ if(!idb){ mem[store].delete(id); return; } return tx(store,'readwrite',s=>s.delete(id)); },
  async all(store){ if(!idb) return [...mem[store].values()]; return tx(store,'readonly',s=>s.getAll()); },
  async photosOf(inspId){ if(!idb) return [...mem.photos.values()].filter(p=>p.inspId===inspId); return tx('photos','readonly',s=>s.index('insp').getAll(inspId)); },
};

const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const strip=o=>{ if(o==null) return o; const c=clone(o); delete c._mirror; return c; };
function withTimeout(pr,ms){ return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]); }
const RemoteDB={
  async put(store,obj){ return withTimeout(rdb.collection(COLL[store]).doc(obj.id).set(strip(obj)),12000); },
  async get(store,id){ const d=await withTimeout(rdb.collection(COLL[store]).doc(id).get(),8000); return d.exists? clone(d.data()) : undefined; },
  async del(store,id){ return withTimeout(rdb.collection(COLL[store]).doc(id).delete(),12000); },
  async all(store){ const q=await withTimeout(rdb.collection(COLL[store]).get(),10000); return q.docs.map(d=>clone(d.data())); },

/* ---------- Mode hors connexion : copie locale + file d'attente d'envoi ---------- */
const pending=new Map(); // "store:id" -> {store,id,op,obj}
function retryable(e){ return !e || !['invalid_argument','not_granted','quota_exceeded','revoked','capability_disabled','capability_removed'].includes(e.code); }
async function queueOp(store,id,op,obj){ const k=store+':'+id; pending.set(k,{store,id,op,obj}); try{ await LocalDB.put('outbox',{k,store,id,op,t:Date.now()}); }catch(e){} netStatus(); scheduleFlush(); }
let flushing=false, flushT=null;
function scheduleFlush(){ clearTimeout(flushT); if(pending.size) flushT=setTimeout(flushOutbox, navigator.onLine===false?20000:8000); }
async function flushOutbox(){
  if(flushing||!rdb||!pending.size) return; if(navigator.onLine===false){ scheduleFlush(); return; }
  flushing=true; netStatus();
  try{ for(const [k,e] of [...pending]){
      if(e.op==='put'){ const obj=(await LocalDB.get(e.store,e.id))||e.obj; if(obj) await RemoteDB.put(e.store,obj); }
      else await RemoteDB.del(e.store,e.id).catch(x=>{ if(retryable(x)) throw x; });
      pending.delete(k); try{ await LocalDB.del('outbox',k); }catch(x){} }
    toast('Connexion retrouvée : tout est synchronisé');
  }catch(e){ if(!retryable(e)){ toast("Certaines modifications n'ont pas pu être envoyées (accès refusé)."); } }
  flushing=false; netStatus(); scheduleFlush();
}
async function loadOutbox(){ pending.clear(); if(!rdb||!idb) return; let l=[]; try{ l=await LocalDB.all('outbox'); }catch(e){}
  for(const e of l){ pending.set(e.k,{store:e.store,id:e.id,op:e.op,obj:e.op==='put'?await LocalDB.get(e.store,e.id):null}); } netStatus(); if(pending.size) setTimeout(flushOutbox,1500); }
function overlay(store,list){ if(!pending.size) return list; const out=new Map(list.map(x=>[x.id,x]));
  pending.forEach(e=>{ if(e.store!==store) return; if(e.op==='del') out.delete(e.id); else if(e.obj) out.set(e.id,strip(e.obj)); }); return [...out.values()]; }
function netStatus(){ const el=$('#net'); if(!el) return; const n=pending.size;
  if(!n){ el.hidden=true; return; } el.hidden=false; el.textContent=flushing?'Synchronisation…':(navigator.onLine===false?'Hors connexion · ':'En attente · ')+(flushing?'':n+' modif.'); }
window.addEventListener('online',()=>{ netStatus(); flushOutbox(); }); window.addEventListener('offline',netStatus);
const DB={
  async put(store,obj){ if(!rdb) return LocalDB.put(store,obj);
    try{ await LocalDB.put(store,{...clone(obj),_mirror:1}); }catch(e){}
    const k=store+':'+obj.id; if(navigator.onLine===false||pending.has(k)){ await queueOp(store,obj.id,'put',obj); return; }
    try{ await RemoteDB.put(store,obj); if(pending.size) scheduleFlush(); }
    catch(e){ if(!retryable(e)) throw e; await queueOp(store,obj.id,'put',obj); } },
  async get(store,id){ if(!rdb) return LocalDB.get(store,id);
    if(pending.has(store+':'+id)||navigator.onLine===false){ const l=await LocalDB.get(store,id).catch(()=>null); if(l) return strip(l); }
    try{ const r=await RemoteDB.get(store,id); if(r) LocalDB.put(store,{...r,_mirror:1}).catch(()=>{}); return r; }
    catch(e){ const l=await LocalDB.get(store,id).catch(()=>null); if(l) return strip(l); throw e; } },
  async del(store,id){ if(!rdb) return LocalDB.del(store,id);
    try{ await LocalDB.del(store,id); }catch(e){}
    if(navigator.onLine===false){ await queueOp(store,id,'del'); return; }
    try{ await RemoteDB.del(store,id); pending.delete(store+':'+id); LocalDB.del('outbox',store+':'+id).catch(()=>{}); }
    catch(e){ if(!retryable(e)) throw e; await queueOp(store,id,'del'); } },
  async all(store){ if(!rdb) return LocalDB.all(store);
    try{ return overlay(store,await RemoteDB.all(store)); }catch(e){ return (await LocalDB.all(store).catch(()=>[])).filter(x=>x._mirror).map(strip); } },
  async photosOf(inspId){ if(!rdb) return LocalDB.photosOf(inspId);
    let r=[]; try{ r=await RemoteDB.photosOf(inspId); }catch(e){ return (await LocalDB.photosOf(inspId).catch(()=>[])).map(strip); }
    const loc=(await LocalDB.photosOf(inspId).catch(()=>[])).filter(p=>pending.has('photos:'+p.id)).map(strip);
    const m=new Map(r.map(p=>[p.id,p])); loc.forEach(p=>m.set(p.id,p)); return [...m.values()]; },
};

/* Inspections restées dans le stockage local de l'appareil, pas encore partagées */
async function localPending(){
  if(!idb) return [];
  let loc=[]; try{ loc=await LocalDB.all('insp'); }catch(e){ return []; }
  if(sharedList==null) return [];
  const ids=new Set(sharedList.map(i=>i.id)); return loc.filter(i=>!i._mirror&&!ids.has(i.id));
}
async function migrate(btn, items){
  btn.disabled=true; let done=0;
  try{
    for(const i of items){
      btn.textContent=`Envoi ${done+1}/${items.length}…`;
      const ps=await LocalDB.photosOf(i.id);
      for(const p of ps){ const r=await shrinkToFit(p); await RemoteDB.put('photos',{id:p.id,inspId:i.id,...r}); }
      await RemoteDB.put('insp',i); await LocalDB.del('insp',i.id); for(const p of ps) await LocalDB.del('photos',p.id);
      done++;
    }
    toast(done>1?`${done} inspections partagées`:'Inspection partagée');
  }catch(e){ toast(writeRefused(e)?"Vous n'avez pas le droit d'ajouter des inspections.":`Envoi interrompu après ${done} inspection(s) : réessayez.`); }
  render();
}

function bindItem(el){
  const key=el.dataset.key;
  el.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{
    const a=insp.answers[key] ||= {v:null,c:'',photos:[]};
    let v=b.dataset.set; if(/^\d$/.test(v)) v=+v;
    if(v==='half'){ if(typeof a.v!=='number') return; a.v = a.v%1 ? a.v-0.5 : Math.min(5,a.v+0.5); }
    else a.v = a.v===v ? null : v; touch(); refreshItem(key); updateZoneHead(); syncAction(key);
  });
  el.querySelector('[data-cmt]').onclick=()=>{ const t=el.querySelector('textarea'); t.hidden=false; (insp.answers[key] ||= {v:null,c:'',photos:[]}).showC=true; t.focus(); };
  el.querySelector('textarea').oninput=e=>{ (insp.answers[key] ||= {v:null,c:'',photos:[]}).c=e.target.value; touch(); const ex=actFor(insp.id,key); if(ex&&canWrite){ ex.critC=e.target.value; saveActSoon(ex); } };
  el.querySelector('[data-cam]').onclick=()=>pickPhoto({type:'item',key},'cam');
  el.querySelector('[data-gal]').onclick=()=>pickPhoto({type:'item',key},'gal');
  el.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openViewer(b.dataset.view,{type:'item',key}));
  el.querySelectorAll('[data-eff-open]').forEach(b=>b.onclick=()=>go({name:'action', id:b.dataset.effOpen, back:{name:'zone',z:view.z}}));
  el.querySelectorAll('[data-eff]').forEach(b=>b.onclick=async()=>{ if(!canWrite) return; const a=ACTS.find(x=>x.id===b.dataset.eaid); if(!a) return; insp.eff ||= {};
    if(b.dataset.eff==='non'){ insp.eff[key]={ok:false,num:a.num,aid:a.id}; a.lastCheck={date:insp.date,ok:false}; saveActSoon(a); touch(); refreshItem(key); return; }
    if(!await askConfirm(`L'action N°${a.num} est efficace ?`,"La ligne sera supprimée du plan d'action.",'Oui, supprimer')) return;
    clearTimeout(actTimers.get(a.id));
    try{ await DB.del('act',a.id); ACTS=ACTS.filter(x=>x.id!==a.id); insp.eff[key]={ok:true,num:a.num}; touch(); toast(`Action N°${a.num} supprimée du plan d'action`); refreshItem(key); syncAction(key); }
    catch(e){ toast("Suppression impossible pour l'instant, réessayez."); } });
  const ab=el.querySelector('[data-act]'); if(ab) ab.onclick=async()=>{ const back={name:'zone',z:view.z}; let a=actFor(insp.id,key), fresh=false;
    if(!a){ ab.disabled=true; if(saveT){ clearTimeout(saveT); await flushSave(); } a=await createFromItem(key); ab.disabled=false; fresh=true; }
    if(a) go({name:'action', id:a.id, back, fresh}); };
}
function bindObs(el,z){
  const id=el.dataset.obs; const o=()=> (insp.obs[z.id]||[]).find(x=>x.id===id);
  el.querySelector('textarea').oninput=e=>{ o().c=e.target.value; touch(); };

  el.querySelector('[data-ogal]').onclick=()=>pickPhoto({type:'obs',z:z.id,id},'gal');
  el.querySelector('[data-odel]').onclick=async()=>{ if(!await askConfirm('Retirer cette observation ?','Le commentaire et ses photos seront supprimés.','Retirer')) return; for(const p of o().photos) await DB.del('photos',p).catch(()=>{});
    insp.obs[z.id]=insp.obs[z.id].filter(x=>x.id!==id); touch(); el.remove(); };
  el.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openViewer(b.dataset.view,{type:'obs',z:z.id,id}));
}
function refreshItem(key){
  const old=document.querySelector(`.item[data-key="${CSS.escape(key)}"]`); if(!old) return;
  const it=ZONES.flatMap(z=>z.groups.flatMap(g=>g.items)).find(i=>i.key===key);
  const ta=old.querySelector('textarea'); const hadFocus=document.activeElement===ta;
  const w=document.createElement('div'); w.innerHTML=itemHTML(it); const el=w.firstElementChild; old.replaceWith(el); bindItem(el); loadThumbs(el);
  if(hadFocus) el.querySelector('textarea').focus();
}
function refreshObs(zid,id){ const old=document.querySelector(`[data-obs="${CSS.escape(id)}"]`); if(!old) return; const o=insp.obs[zid].find(x=>x.id===id);
  const w=document.createElement('div'); w.innerHTML=obsHTML(o); const el=w.firstElementChild; old.replaceWith(el); bindObs(el,ZONES.find(z=>z.id===zid)); loadThumbs(el); }

function pickPhoto(target,src){ if(!canWrite){ toast("Accès en consultation : ajout de photo impossible."); return; } pendingPhotoTarget=target; const inp=src==='cam'?$('#cam'):$('#gal'); inp.value=''; inp.click(); }
async function onFiles(files){
  const target=pendingPhotoTarget; if(!target||!files.length) return;
  for(const f of files){
    try{ const {data,w,h}=await compress(f); const id=uid(); const rec={id,inspId:target.type==='inc'?target.id:insp.id,data,w,h};
      await DB.put('photos',rec); photoCache.set(id,rec);
      if(target.type==='inc'){ const i=INCS.find(x=>x.id===target.id); if(i) i.photos.push(id); }
      else if(target.type==='item'){ const a=insp.answers[target.key] ||= {v:null,c:'',photos:[]}; a.photos.push(id); }
      else { insp.obs[target.z].find(x=>x.id===target.id).photos.push(id); }
    }catch(e){ toast(e&&e.message==='image' ? "Photo non enregistrée : le fichier n'a pas pu être lu comme une image." : "Photo non enregistrée : envoi impossible pour l'instant, réessayez."); }
  }

// Chaque photo est un document partagé (limite 256 Ko) : on réduit jusqu'à tenir sous ~230 Ko.
const MAXLEN=230000;
function encodeFit(img,iw,ih){
  const steps=[[1600,.78],[1600,.66],[1280,.66],[1024,.62],[800,.6],[640,.55]];
  let out=null;
  for(const [M,q] of steps){ const k=Math.min(1,M/Math.max(iw,ih)); const w=Math.round(iw*k), h=Math.round(ih*k);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    out={data:c.toDataURL('image/jpeg',q),w,h}; if(out.data.length<=MAXLEN) return out; }
  return out;
}
function compress(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{ const r=encodeFit(img,img.naturalWidth,img.naturalHeight); URL.revokeObjectURL(url); res(r); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('image')); }; img.src=url; }); }
function shrinkToFit(p){ if(p.data.length<=MAXLEN) return Promise.resolve({data:p.data,w:p.w,h:p.h});
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(encodeFit(img,p.w,p.h)); img.onerror=()=>rej(new Error('image')); img.src=p.data; }); }
async function getPhoto(id){ if(photoCache.has(id)) return photoCache.get(id); let p; try{ p=await DB.get('photos',id); }catch(e){} if(p) photoCache.set(id,p); return p; }
function loadThumbs(root){ root.querySelectorAll('img[data-pid]').forEach(async im=>{ const p=await getPhoto(im.dataset.pid); if(p) im.src=p.data; }); }
async function openViewer(pid,target){
  const p=await getPhoto(pid); if(!p) return;
  const v=document.createElement('div'); v.className='viewer'; v.setAttribute('role','dialog'); v.setAttribute('aria-label','Photo');
  v.innerHTML=`<div class="vbar"><button class="btn" data-x>Fermer</button><button class="btn del" data-d>Supprimer la photo</button></div><img alt="Photo d'inspection" src="${p.data}">`;
  document.body.appendChild(v); v.querySelector('[data-x]').focus();
  const close=()=>{ v.remove(); document.removeEventListener('keydown',onK); }; const onK=e=>{ if(e.key==='Escape') close(); }; document.addEventListener('keydown',onK);
  v.querySelector('[data-x]').onclick=close;
  v.querySelector('[data-d]').onclick=async()=>{ await DB.del('photos',pid).catch(()=>{}); photoCache.delete(pid);
    if(target.type==='inc'){ const i=INCS.find(x=>x.id===target.id); if(i){ i.photos=i.photos.filter(x=>x!==pid); saveIncSoon(i); if(view.name==='inc') renderInc($('#app')); } }
    else if(target.type==='item'){ const a=insp.answers[target.key]; a.photos=a.photos.filter(x=>x!==pid); touch(); refreshItem(target.key); }
    else { const o=insp.obs[target.z].find(x=>x.id===target.id); o.photos=o.photos.filter(x=>x!==pid); touch(); refreshObs(target.z,target.id); }
    close(); };
}

const LIBS={ xlsx:'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js', docx:'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js' };
function loadLib(k){ return new Promise((res,rej)=>{ if(k==='xlsx'&&window.ExcelJS) return res(); if(k==='docx'&&window.docx) return res();

  const dl=await dlPromise;
  if(dl){ try{ await dl.save({filename:name,data:blob}); toast('Rapport enregistré'); }
    catch(e){ if(e&&e.code==='declined') toast('Enregistrement annulé'); else if(e&&e.code==='rate_limited') toast("Une demande d'enregistrement est déjà ouverte."); else toast("Enregistrement impossible ici ("+(e&&e.code||'erreur')+")."); }
    return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000);
}

    else if(kind==='photo'){ const doc=buildPhotoDocx(window.docx, insp, photos); const blob=await window.docx.Packer.toBlob(doc); await saveFile(`Compte_rendu_photo_${insp.date}.docx`, blob); }

        children.push(new Paragraph({spacing:{after:160}, children:[new TextRun({text:p.where+(p.rep?` (${p.rep})`:''), bold:true, size:18}), ...(p.comment?[new TextRun({text:' — '+p.comment, size:18})]:[])]}));
      }); }
  });
  children.push(...sigDocx(D, insp));
  return new Document({
    creator:MOD.name, title:`${MOD.name} ${frDate(insp.date)}`,
    styles:{ default:{ document:{ run:{ font:'Calibri', size:21, color:'2B2940' } } },
      paragraphStyles:[
        {id:'Title',name:'Title',basedOn:'Normal',run:{size:44,bold:true,color:'2B2940'},paragraph:{spacing:{after:80}}},
        {id:'Heading1',name:'Heading 1',basedOn:'Normal',next:'Normal',run:{size:30,bold:true,color:'57489A'},paragraph:{spacing:{before:240,after:120}}},
        {id:'Heading2',name:'Heading 2',basedOn:'Normal',next:'Normal',run:{size:24,bold:true,color:'2D5C86'},paragraph:{spacing:{before:200,after:80}}} ] },
    sections:[{ properties:{ page:{ margin:{top:1000,bottom:1000,left:1000,right:1000} } },
      headers:{ default:new Header({children:[new Paragraph({alignment:AlignmentType.RIGHT, children:[new TextRun({text:`${REF.code} — Inspection du ${frDate(insp.date)}`, size:16, color:'8A86A0'})]})]}) },
      footers:{ default:new Footer({children:[new Paragraph({alignment:AlignmentType.CENTER, children:[new TextRun({children:['Page ',PageNumber.CURRENT,' / ',PageNumber.TOTAL_PAGES], size:16, color:'8A86A0'})]})]}) },

  });
}
/* Compte rendu photo : points notés Non ou 0 à 2 */
function buildPhotoDocx(D, insp, photos){
  const {Document,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,HeadingLevel,AlignmentType,ShadingType,ImageRun,BorderStyle,Header,PageNumber,Footer}=D;
  const P=(text,o={})=>new Paragraph({ spacing:{after:o.after??80,before:o.before}, keepNext:o.keep, alignment:o.align, children:[new TextRun({text:String(text??''), bold:o.bold, size:o.size, color:o.color, italics:o.it})] });
  const border={style:BorderStyle.SINGLE,size:4,color:'DADAE6'}; const borders={top:border,bottom:border,left:border,right:border};
  const none={style:BorderStyle.NONE,size:0,color:'FFFFFF'}; const noB={top:none,bottom:none,left:none,right:none};
  const cell=(text,o={})=>new TableCell({ borders, width:o.w?{size:o.w,type:WidthType.DXA}:undefined, shading:o.fill?{type:ShadingType.CLEAR,color:'auto',fill:o.fill}:undefined,
    margins:{top:50,bottom:50,left:90,right:90}, children:[P(text,{bold:o.bold,size:o.size||18,after:0,color:o.color,align:o.align})] });
  const devs=deviations(); const children=[];
  children.push(new Table({ width:{size:9906,type:WidthType.DXA}, columnWidths:[1500,8406], rows:[ new TableRow({children:[
    new TableCell({borders:noB, width:{size:1500,type:WidthType.DXA}, children:[new Paragraph({children:[new ImageRun({data:b64ToBytes('data:,'+LOGO_PNG), transformation:{width:70,height:75}})]})]}),
    new TableCell({borders:noB, width:{size:8406,type:WidthType.DXA}, children:[
      new Paragraph({heading:HeadingLevel.TITLE, children:[new TextRun('Compte rendu photo — points à améliorer')]}),
      P(`Inspection du ${frDate(insp.date)}${insp.inspecteur?'   ·   Inspecteur : '+insp.inspecteur:''}`,{bold:true}),
      P(`${devs.length} point${devs.length>1?'s':''} ${MOD.pct?'':'noté'+(devs.length>1?'s':'')+' '}${MOD.dev}${insp.remarque?'   ·   Contexte : '+insp.remarque:''}`,{color:'6C6884',size:18}) ]}) ]}) ] }));
  children.push(P('',{after:120}));
  if(!devs.length){ children.push(P(`Aucun point ${MOD.dev} sur cette inspection.`,{it:true})); }
  else {
    // Récapitulatif
    const W=[600,1500,1700,3406,700,800,1200];
    const rows=[new TableRow({tableHeader:true, children:['N°','Zone','Groupe','Critère','Note','Photos','Action'].map((h,i)=>cell(h,{bold:true,fill:'EEEEF4',w:W[i]}))})];
    devs.forEach((d,i)=>{ const ex=coverAct(d.it.key); rows.push(new TableRow({children:[cell(String(i+1),{bold:true,w:W[0]}),cell(d.z.name,{fill:PASTEL[d.z.c],w:W[1]}),cell(d.g.name,{w:W[2]}),cell(d.it.label,{w:W[3]}),cell(answerLabel(d.it,d.a),{bold:true,fill:LVLFILL.bad,align:AlignmentType.CENTER,w:W[4]}),cell(String((d.a.photos||[]).length),{align:AlignmentType.CENTER,w:W[5]}),cell(ex?'N°'+ex.num:'–',{align:AlignmentType.CENTER,w:W[6]})]})); });
    children.push(new Table({width:{size:9906,type:WidthType.DXA}, columnWidths:W, rows}));
    // Détail avec photos
    let lastZ=null;
    devs.forEach((d,i)=>{ const ex=coverAct(d.it.key);
      if(d.z.id!==lastZ){ children.push(new Paragraph({heading:HeadingLevel.HEADING_1, pageBreakBefore:lastZ===null, keepNext:true, children:[new TextRun(d.z.name)]})); lastZ=d.z.id; }
      children.push(new Paragraph({keepNext:true, spacing:{before:200,after:60}, shading:{type:ShadingType.CLEAR,color:'auto',fill:PASTEL[d.z.c]}, children:[
        new TextRun({text:`${i+1}. ${d.g.name}${d.it.sec?' / '+d.it.sec:''} — ${d.it.label}`, bold:true, size:22}), new TextRun({text:`   Note : ${answerLabel(d.it,d.a)}`, bold:true, size:22, color:'9B3833'}) ]}));
      if(d.a.c) children.push(P('Constat : '+d.a.c,{keep:true}));
      if(ex) children.push(P(`Action N°${ex.num}${ex.action?' : '+ex.action:''}${ex.resp?'   ·   Responsable : '+ex.resp:''}${ex.deadline?'   ·   Deadline : '+frDate(ex.deadline):''}`,{keep:true,color:'57489A',size:19}));
      const recs=(d.a.photos||[]).map(id=>photos.get(id)).filter(Boolean);
      if(!recs.length){ children.push(P('Aucune photo prise pour ce point.',{it:true,color:'8A86A0',size:18})); return; }
      const img=r=>{ const Wp=300, Hp=Math.round(Wp*r.h/r.w), Hc=Math.min(Hp,300), Wc=Math.round(Hc*r.w/r.h); return new Paragraph({alignment:AlignmentType.CENTER, children:[new ImageRun({data:b64ToBytes(r.data), transformation:{width:Wc,height:Hc}})]}); };
      const prow=[]; for(let k=0;k<recs.length;k+=2) prow.push(new TableRow({cantSplit:true, children:[0,1].map(j=>new TableCell({borders:noB, width:{size:4953,type:WidthType.DXA}, margins:{top:60,bottom:60,left:60,right:60}, children:[recs[k+j]?img(recs[k+j]):new Paragraph('')]}))}));
      children.push(new Table({width:{size:9906,type:WidthType.DXA}, columnWidths:[4953,4953], rows:prow}));
    });
  }
  children.push(...sigDocx(D, insp));
  return new Document({
    creator:'Cognac Embouteillage', title:`Compte rendu photo ${frDate(insp.date)}`,
    styles:{ default:{ document:{ run:{ font:'Calibri', size:21, color:'2B2940' } } },
      paragraphStyles:[
        {id:'Title',name:'Title',basedOn:'Normal',run:{size:36,bold:true,color:'2B2940'},paragraph:{spacing:{after:60}}},
        {id:'Heading1',name:'Heading 1',basedOn:'Normal',next:'Normal',run:{size:30,bold:true,color:'57489A'},paragraph:{spacing:{before:120,after:120}}} ] },
    sections:[{ properties:{ page:{ margin:{top:900,bottom:900,left:1000,right:1000} } },
      headers:{ default:new Header({children:[new Paragraph({alignment:AlignmentType.RIGHT, children:[new TextRun({text:`${REF.code} — Compte rendu photo du ${frDate(insp.date)}`, size:16, color:'8A86A0'})]})]}) },
      footers:{ default:new Footer({children:[new Paragraph({alignment:AlignmentType.CENTER, children:[new TextRun({children:['Page ',PageNumber.CURRENT,' / ',PageNumber.TOTAL_PAGES], size:16, color:'8A86A0'})]})]}) },
      children }]
  });
}

/* ================= PLAN D'ACTION ================= */
let ACTS=[], actsLoaded=false, curAct=null;
let planF={ st:'open', z:'all', r:'all' };
let planMode='cards'; try{ planMode=localStorage.getItem('plan-mode')||'cards'; }catch(e){}
const PDCA=[['P','Planifier','Analyser la cause, définir l\'action'],['D','Réaliser','Mettre l\'action en œuvre'],['C','Contrôler','Vérifier que c\'est efficace'],['A','Agir','Standardiser, pérenniser']];
const zoneOf=id=>ZONES.find(z=>z.id===id)||null;
function isDev(it,a){ return !!a && a.v!=null && a.v!=='na' && ((it.yn||it.bv) ? a.v==='non' : a.v<=2); }
function actFor(inspId,key){ return ACTS.find(a=>a.src&&a.src.inspId===inspId&&a.src.key===key); }
function priorActs(key){ if(!insp) return []; return ACTS.filter(a=>a.src&&a.src.key===key&&a.src.inspId!==insp.id&&!a.realise&&(a.date||'')<=insp.date).sort((x,y)=>y.date.localeCompare(x.date)||y.num-x.num); }
function coverAct(key){ return actFor(insp.id,key)||priorActs(key)[0]||null; }
function effHTML(key){
  const pr=priorActs(key); const e=(insp.eff||{})[key];
  if(!pr.length){ return e&&e.ok? `<div class="eff ok"><b>Action corrective efficace</b><small>L'action N°${e.num} a été supprimée du plan d'action.</small></div>` : ''; }
  const a=pr[0]; const no=e&&!e.ok&&e.aid===a.id;
  return `<div class="eff${no?' no':''}"><b>⚠ Non-conformité relevée lors de la précédente inspection</b>
    <small>Inspection du ${frDate(a.date)} · ${MOD.pct?'':'note '}${esc(a.critVal)} · <button class="lnk" data-eff-open="${a.id}">Action N°${a.num}</button>${a.action?' — '+esc(a.action):''}</small>
    <div class="eff-q">Vérification d'efficacité : l'action corrective est-elle efficace ?</div>
    <div class="eff-btns"><button class="ch yn oui" data-eff="oui" data-eaid="${a.id}" ${canWrite?'':'disabled'}>Oui</button><button class="ch yn non${no?' on':''}" data-eff="non" data-eaid="${a.id}" aria-pressed="${no}" ${canWrite?'':'disabled'}>Non</button></div>
    ${no?`<small>Non efficace : l'action N°${a.num} reste dans le plan d'action.</small>`:''}</div>`;
}
function isDone(a){ return !!a.realise; }
function isLate(a){ return !isDone(a) && a.deadline && a.deadline<today(); }
function actStatus(a){ return isDone(a)?['Soldée','good']: isLate(a)?['En retard','bad']:['En cours','none']; }
function planCountText(){ if(!actsLoaded&&rdb) return 'Chargement…'; const o=ACTS.filter(a=>!isDone(a)).length, l=ACTS.filter(isLate).length;
  return ACTS.length? `${o} action${o>1?'s':''} en cours${l?` · ${l} en retard`:''} · ${ACTS.length-o} soldée${ACTS.length-o>1?'s':''}` : 'Aucune action pour le moment'; }
async function loadActsLocal(){ if(rdb) return; try{ ACTS=await LocalDB.all('act')||[]; }catch(e){ ACTS=[]; } actsLoaded=true; }
function subscribeActs(){
  unsubActs=rdb.collection(COLL.act).onSnapshot(q=>{ ACTS=overlay('act',q.docs.map(d=>clone(d.data()))); if(curAct){ const i=ACTS.findIndex(a=>a.id===curAct.id); if(i>=0) ACTS[i]=curAct; } actsLoaded=true; onActsChanged(); }, ()=>{});
}
function onActsChanged(){
  if(view.name==='plan') renderPlan($('#app')); else if(view.name==='kpi') renderKpi($('#app'));
  else if(view.name==='home'){ const c=$('#plan-count'); if(c) c.textContent=planCountText(); const ab=$('#alert-bar'); const n=alertHTML(); if(ab){ if(n) ab.outerHTML=n; else ab.remove(); bindAlert(); } }
}
async function waitActs(){ for(let i=0;i<50&&!actsLoaded;i++) await new Promise(r=>setTimeout(r,100)); if(!actsLoaded&&rdb){ try{ ACTS=await RemoteDB.all('act'); actsLoaded=true; }catch(e){} } }
async function createAction(o){
  if(!canWrite){ toast("Accès en consultation : création d'action impossible."); return null; }
  await waitActs();
  const num=ACTS.reduce((m,a)=>Math.max(m,a.num||0),0)+1;
  const a={ id:uid(), num, date:o.date||today(), zoneId:o.zoneId, ligne:o.ligne, theme:o.theme, src:o.src||null, crit:o.crit||'', critVal:o.critVal||'', critC:o.critC||'',
    sujet:'', action:'', resp:'', deadline:'', pdca:0, realise:'', createdAt:Date.now(), updatedAt:Date.now() };
  try{ await DB.put('act',a); }catch(e){ toast(writeRefused(e)?"Vous n'avez pas le droit de créer des actions.":"Création impossible pour l'instant, réessayez."); return null; }
  if(!ACTS.some(x=>x.id===a.id)) ACTS.push(a);
  return a;
}
const autoPending=new Set();
function untouched(a){ return !a.sujet&&!a.action&&!a.resp&&!a.deadline&&!a.pdca&&!a.realise; }
async function syncAction(key){
  if(!canWrite||!insp) return;
  const [zid,gi]=key.split('.'); const it=zoneOf(zid).groups[+gi].items.find(i=>i.key===key); const ans=insp.answers[key];
  const ex=actFor(insp.id,key);
  if(isDev(it,ans)){
    if(ex){ const v=answerLabel(it,ans); if(ex.critVal!==v){ ex.critVal=v; saveActSoon(ex); } return; }
    if(priorActs(key).length) return; // l'action de la dernière fois est toujours ouverte
    if(autoPending.has(key)) return; autoPending.add(key);
    const a=await createFromItem(key); autoPending.delete(key);
    if(a){ toast(`Action N°${a.num} ajoutée au plan d'action`); if(view.name==='zone') refreshItem(key); }
  } else if(ex && untouched(ex)){
    clearTimeout(actTimers.get(ex.id));
    try{ await DB.del('act',ex.id); ACTS=ACTS.filter(x=>x.id!==ex.id); toast(`Action N°${ex.num} retirée (note remontée au-dessus de 2)`); if(view.name==='zone') refreshItem(key); }catch(e){}
  }
}
async function createFromItem(key){
  const [zid,gi]=key.split('.'); const z=zoneOf(zid); const g=z.groups[+gi]; const it=g.items.find(i=>i.key===key); const ans=insp.answers[key]||{};
  return createAction({ date:insp.date, zoneId:z.id, ligne:z.name, theme:g.name, src:{inspId:insp.id,key}, crit:(it.sec?it.sec+' — ':'')+it.label+(it.cp?' (contact produit)':''), critVal:answerLabel(it,ans), critC:ans.c||'' });
}
const actTimers=new Map();
function saveActSoon(a){ if(!canWrite) return; a.updatedAt=Date.now(); clearTimeout(actTimers.get(a.id)); actTimers.set(a.id,setTimeout(()=>saveAct(a),450)); }
async function saveAct(a){ actTimers.delete(a.id);
  try{ await DB.put('act',clone(a)); const i=ACTS.findIndex(x=>x.id===a.id); if(i>=0) ACTS[i]=a; else ACTS.push(a); flashSaved(); }
  catch(e){ if(writeRefused(e)){ canWrite=false; toast("Accès en lecture seule : modification non enregistrée."); } else toast("Sauvegarde impossible pour l'instant : nouvel essai à la prochaine modification."); } }
function setPdca(a,i){ a.pdca = a.pdca===i+1 ? i : i+1; saveActSoon(a); }

function pdcaHTML(a,big){

function planList(){

let kpiPer='3m'; try{ kpiPer=localStorage.getItem('kpi-per')||'3m'; }catch(e){}
const PERIODS=[['month','Mois en cours'],['3m','3 derniers mois'],['year','Année'],['all','Tout']];
function perStart(k){ const d=new Date(); const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  if(k==='month') return iso(new Date(d.getFullYear(),d.getMonth(),1)); if(k==='3m') return iso(new Date(d.getFullYear(),d.getMonth()-3,d.getDate()));
  if(k==='year') return iso(new Date(d.getFullYear(),0,1)); return ''; }
function tabsHTML(on){ return `<div class="tabs" role="tablist"><button role="tab" aria-selected="${on==='plan'}" class="${on==='plan'?'on':''}" data-tab="plan">Plan d'action</button><button role="tab" aria-selected="${on==='kpi'}" class="${on==='kpi'?'on':''}" data-tab="kpi">Indicateurs</button></div>`; }
function bindTabs(app){ app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ if(view.name!==b.dataset.tab) go({name:b.dataset.tab}); }); }
const RC={good:'var(--mint-ink)',mid:'var(--butter-ink)',bad:'var(--rose-ink)',none:'var(--line)'};
function ringSVG(frac,color,center,size){ size=size||132; const r=42,C=2*Math.PI*r; const f=frac==null?0:Math.max(0,Math.min(1,frac));
  return `<div class="ring" style="width:${size}px;height:${size}px;--fs:${Math.round(size*.22)}px"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="11"/>
  ${f>0?`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="${f>=1?'butt':'round'}" stroke-dasharray="${(f*C).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 50 50)"/>`:''}</svg><div class="ring-c">${center}</div></div>`; }
function donutSVG(parts,center,size){ size=size||150; const r=42,C=2*Math.PI*r; const tot=parts.reduce((s,p)=>s+p.n,0); let acc=0; const gap=parts.filter(p=>p.n).length>1?1.2:0;
  const segs=tot? parts.filter(p=>p.n).map(p=>{ const len=p.n/tot*C; const s=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${p.c}" stroke-width="12" stroke-dasharray="${Math.max(0,len-gap).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 50 50)"/>`; acc+=len; return s; }).join('') : '';
  return `<div class="ring" style="width:${size}px;height:${size}px;--fs:${Math.round(size*.2)}px"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="12"/>${segs}</svg><div class="ring-c">${center}</div></div>`; }
const pct=(a,b)=>b? Math.round(a/b*100) : null;
const lvlRate=(p,inv)=> p==null?'none' : inv ? (p<=10?'good':p<=25?'mid':'bad') : (p>=80?'good':p>=50?'mid':'bad');

async function kpiData(){
  let all=[]; if(rdb){ if(sharedList==null) return null; all=sharedList.slice(); } else { try{ all=await DB.all('insp'); }catch(e){} }
  all.sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);
  const st=perStart(kpiPer), inP=d=>!st||(d||'')>=st;
  const ins=all.filter(i=>inP(i.date));
  const last=ins[ins.length-1]||null; const prev=last? all[all.indexOf(last)-1]||null : null;
  const ref= ins.length>=2 ? ins[0] : prev; // tendance : début de période -> dernière inspection
  const trend=[]; if(last&&ref){ const GL=globalScore(last.answers), GR=globalScore(ref.answers);
    ZONES.forEach((z,zi)=>z.groups.forEach((g,gi)=>{ const a=GL.zones[zi].groups[gi].note, b=GR.zones[zi].groups[gi].note; if(a!=null&&b!=null) trend.push({z,g,now:a,before:b,d:a-b}); })); }
  // plan d'action
  const acts=ACTS.filter(a=>inP(a.date));
  let effOk=0; ins.forEach(i=>Object.values(i.eff||{}).forEach(e=>{ if(e&&e.ok) effOk++; }));
  const done=acts.filter(isDone).length+effOk, total=acts.length+effOk;
  const open=acts.filter(a=>!isDone(a)); const late=open.filter(isLate).length;
  const stages=[0,1,2,3,4].map(k=>open.filter(a=>(a.pdca||0)===k).length);
  // déviations récurrentes
  const rec=new Map();
  ins.forEach(i=>ZONES.forEach(z=>z.groups.forEach(g=>g.items.forEach(it=>{ const a=i.answers[it.key]; if(!a||a.v==null||a.v==='na') return;
    const r=rec.get(it.key)||{z,g,it,n:0,dev:0,lastDev:''}; r.n++; if(isDev(it,a)){ r.dev++; r.lastDev=i.date; } rec.set(it.key,r); }))));
  const devKeys=[...rec.values()].filter(r=>r.dev>0); const recur=devKeys.filter(r=>r.dev>=2).sort((a,b)=>b.dev-a.dev||b.dev/b.n-a.dev/a.n);
  return {all,ins,last,prev,ref,trend,done,total,effOk,open:open.length,late,stages,devKeys,recur};
}
async function renderKpi(app){
  setBar('Indicateurs', true); setDock(null);

  if(!D){ app.innerHTML='<div class="empty">Chargement des indicateurs…</div>'; bindTabs(app); return; }
  const {last,ref}=D; const TH=1;
  const refTxt= ref&&last? `entre le ${frDate(ref.date)} et le ${frDate(last.date)}` : '';
  const dTag=d=> d==null?'' : `<em class="dtag ${d>=TH?'up':d<=-TH?'down':''}">${d>=TH?'▲':d<=-TH?'▼':'='} ${d>0?'+':''}${fmt(d)}</em>`;
  // 1. note par ligne (avec évolution)
  const c1= !last? `<div class="kpi-card wide"><h3>${MOD.L.par}</h3><div class="empty">Aucune inspection sur cette période.</div></div>`
   : (()=>{ const G=globalScore(last.answers), GR=ref?globalScore(ref.answers):null; const n=G.note;
    return `<div class="kpi-card wide"><h3>${MOD.L.par} <small>· inspection du ${frDate(last.date)}${ref?` · évolution depuis le ${frDate(ref.date)}`:''}</small></h3>
    <div class="kpi-row" style="margin-bottom:6px">${ringSVG(n==null?null:n/20,RC[lvl(n)],`<b>${fmt(n)}</b><small>${U()}</small>`,110)}<div class="kpi-txt"><p><b>Moyenne générale</b> ${GR&&n!=null&&GR.note!=null?dTag(n-GR.note):''}</p><p class="muted">${D.ins.length} inspection${D.ins.length>1?'s':''} sur la période</p></div></div>

  const c2= !D.trend.length ? `<div class="kpi-card wide"><h3>Tendance des sujets</h3><div class="empty">Il faut au moins deux inspections pour voir une tendance.</div></div>`

      <ul class="legend-l" style="flex:1;min-width:170px"><li><i style="background:var(--mint-ink)"></i>En amélioration<b>${up.length}</b></li><li><i style="background:var(--line)"></i>Stables (moins de ${MOD.pct?'5 % ':'1 pt '}d'écart)<b>${flat}</b></li><li><i style="background:var(--rose-ink)"></i>En baisse<b>${down.length}</b></li></ul></div>
    <div class="trend-cols"><div><h4 class="up-t">▲ En amélioration</h4>${up.length?up.slice(0,6).map(tRow).join(''):'<p class="muted">Aucun sujet en hausse.</p>'}</div>
      <div><h4 class="down-t">▼ En baisse</h4>${down.length?down.slice(0,6).map(tRow).join(''):'<p class="muted">Aucun sujet en baisse.</p>'}</div></div></div>`;
  // 3. réalisation
  const pr=pct(D.done,D.total);
  const c3=`<div class="kpi-card"><h3>Taux de réalisation des actions</h3>${ringSVG(pr==null?null:pr/100,RC[lvlRate(pr)],`<b>${pr==null?'–':pr+'%'}</b>`,140)}
    <p class="kpi-sub">${D.done} soldée${D.done>1?'s':''} sur ${D.total} action${D.total>1?'s':''}${D.effOk?`<br><small>dont ${D.effOk} jugée${D.effOk>1?'s':''} efficace${D.effOk>1?'s':''} à la vérification</small>`:''}</p></div>`;
  // 4. récurrentes
  const prc=pct(D.recur.length,D.devKeys.length);
  const c4=`<div class="kpi-card wide"><h3>${MOD.pct?'Casses récurrentes':'Déviations récurrentes'}</h3><div class="kpi-row">
    ${ringSVG(prc==null?null:prc/100,RC[lvlRate(prc,true)],`<b>${prc==null?'–':prc+'%'}</b>`,130)}
    <div class="kpi-txt"><p><b>${D.recur.length}</b> ${W()}${D.recur.length>1?'s':''} ${MOD.pct?'non intact'+(D.recur.length>1?'s':''):'noté'+(D.recur.length>1?'s':'')+' 2 ou moins'} sur au moins 2 inspections, sur ${D.devKeys.length} ${W()}${D.devKeys.length>1?'s':''} en déviation.</p><p class="muted">Un point qui revient montre que l'action corrective n'a pas traité la cause.</p></div></div>
    ${D.recur.length?`<div class="rec-list">${D.recur.slice(0,8).map(r=>{ const a=ACTS.find(x=>x.src&&x.src.key===r.it.key&&!x.realise); return `<div class="rec" style="${zc(r.z.c)}">${ringSVG(r.dev/r.n,'var(--rose-ink)',`<b>${r.dev}/${r.n}</b>`,54)}
      <div class="meta"><b>${esc(r.it.label)}</b><small>${esc(r.z.name)} · ${esc(r.g.name)} · dernière fois le ${frDate(r.lastDev)}</small></div>
      ${a?`<button class="btn soft sm" data-go-act="${a.id}">N°${a.num}</button>`:''}</div>`; }).join('')}</div>`:''}</div>`;
  app.innerHTML=`<div style="margin-top:14px">${perChips}</div>
  <div class="kpi-grid" style="margin-top:14px">${c1}${c2}</div>
  <div class="kpi-grid kg2" style="margin-top:12px">${c3}${c4}</div>
  <p class="legend">Tendance : note de chaque sujet (zone · groupe) sur 20, entre la première et la dernière inspection de la période (ou l'inspection précédente s'il n'y en a qu'une). Taux de réalisation : actions soldées + actions jugées efficaces à la vérification, selon leur date de création. Déviation : ${MOD.pct?'élément non intact':'note de 0 à 2 ou « Non »'}.</p>`;
  bindTabs(app);
  app.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{ kpiPer=b.dataset.per; try{ localStorage.setItem('kpi-per',kpiPer); }catch(e){} renderKpi(app); });
  app.querySelectorAll('[data-go-act]').forEach(b=>b.onclick=()=>go({name:'action', id:b.dataset.goAct, back:{name:'kpi'}}));
}

/* ================= ALERTES + ÉCHÉANCES ================= */
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); const x=new Date(y,m-1,d+n); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function isSoon(a){ return !isDone(a) && a.deadline && a.deadline>=today() && a.deadline<=addDays(today(),7); }
function alertHTML(){
  const late=ACTS.filter(isLate).length, soon=ACTS.filter(isSoon).length, oi=MOD.inc?INCS.filter(i=>!i.closed).length:0;
  if(!late&&!soon&&!oi) return '';
  const parts=[]; if(late) parts.push(`<b>${late} action${late>1?'s':''} en retard</b>`); if(soon) parts.push(`${soon} échéance${soon>1?'s':''} dans les 7 jours`); if(oi) parts.push(`<b>${oi} incident${oi>1?'s':''} bris de verre ouvert${oi>1?'s':''}</b>`);
  return `<button class="alert-bar${late||oi?'':' soft'}" id="alert-bar"><span class="alert-ic">!</span><span>${parts.join(' · ')}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>`;
}
function bindAlert(){ const b=$('#alert-bar'); if(!b) return; b.onclick=()=>{ const late=ACTS.filter(isLate).length, soon=ACTS.filter(isSoon).length;
  if(!late&&!soon&&MOD.inc) return go({name:'incs'}); planF.st=late?'late':'soon'; go({name:'plan'}); }; }
/* Statistiques des autres modules pour l'accueil général */
function readStore(dbName,store){ return new Promise(res=>{ try{ const r=indexedDB.open(dbName,4); r.onupgradeneeded=()=>upgradeStores(r.result);
  r.onsuccess=()=>{ const d=r.result; try{ const t=d.transaction(store,'readonly'); const q=t.objectStore(store).getAll(); q.onsuccess=()=>{ res(q.result||[]); d.close(); }; q.onerror=()=>{ res([]); d.close(); }; }catch(e){ res([]); d.close(); } };
  r.onerror=()=>res([]); }catch(e){ res([]); } }); }
async function modStats(m){
  let acts=[], incs=[];
  try{ if(rdb){ acts=(await rdb.collection(m.coll.act).get()).docs.map(d=>d.data()); if(m.coll.inc) incs=(await rdb.collection(m.coll.inc).get()).docs.map(d=>d.data()); }
       else { acts=await readStore(m.idb,'act'); if(m.coll.inc) incs=await readStore(m.idb,'inc'); } }catch(e){}
  return { late:acts.filter(isLate).length, soon:acts.filter(isSoon).length, open:acts.filter(a=>!isDone(a)).length, inc:incs.filter(i=>!i.closed).length };
}

let INCS=[], incsLoaded=false, unsubIncs=null, curInc=null;
const INC_STEPS=[['stop','Ligne / poste arrêté'],['zone','Zone balisée et isolée'],['prod','Produits à proximité isolés (bloqués)'],['clean','Nettoyage de la zone effectué'],['tools','Matériel de nettoyage nettoyé ou évacué'],['check','Contrôle visuel avant redémarrage']];
const DECIS=[['attente','En attente'],['libere','Libéré'],['detruit','Détruit'],['retrie','Trié / recontrôlé']];
function subscribeIncs(){ if(!rdb||!COLL.inc) return; unsubIncs=rdb.collection(COLL.inc).onSnapshot(q=>{ INCS=overlay('inc',q.docs.map(d=>clone(d.data()))); if(curInc){ const i=INCS.findIndex(x=>x.id===curInc.id); if(i>=0) INCS[i]=curInc; } incsLoaded=true;
  if(view.name==='incs') renderIncs($('#app')); else if(view.name==='home'){ const c=$('#inc-count'); if(c) c.textContent=incCountText(); } }, ()=>{}); }
async function loadIncsLocal(){ if(rdb||!MOD.inc) return; try{ INCS=await LocalDB.all('inc')||[]; }catch(e){ INCS=[]; } incsLoaded=true; }
function incCountText(){ const o=INCS.filter(i=>!i.closed).length; return INCS.length? `${o} ouvert${o>1?'s':''} · ${INCS.length-o} clôturé${INCS.length-o>1?'s':''}` : 'Aucun incident enregistré'; }
function nowLocal(){ const d=new Date(); return today()+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function frDT(v){ if(!v) return ''; const [d,t]=v.split('T'); return frDate(d)+(t?' à '+t.replace(':','h'):''); }
const incTimers=new Map();
function saveIncSoon(i){ if(!canWrite) return; i.updatedAt=Date.now(); clearTimeout(incTimers.get(i.id)); incTimers.set(i.id,setTimeout(()=>saveInc(i),450)); }
async function saveInc(i){ incTimers.delete(i.id); try{ await DB.put('inc',clone(i)); const k=INCS.findIndex(x=>x.id===i.id); if(k>=0) INCS[k]=i; else INCS.push(i); flashSaved(); }
  catch(e){ toast(writeRefused(e)?"Accès en lecture seule : modification non enregistrée.":"Sauvegarde impossible pour l'instant, réessayez."); } }
async function newIncident(){
  if(!canWrite){ toast("Accès en consultation : déclaration impossible."); return; }
  const num=INCS.reduce((m,i)=>Math.max(m,i.num||0),0)+1; let who=''; try{ who=localStorage.getItem('insp-who')||''; }catch(e){}
  const i={ id:uid(), num, dt:nowLocal(), declarant:who, zoneId:ZONES[0].id, zone:ZONES[0].name, elementKey:'', element:'', mat:'V', cp:false, desc:'', of:'', qty:'', steps:{}, decision:'attente', decisionNote:'',
    photos:[], valid:'', validDate:'', closed:false, actId:'', createdAt:Date.now(), updatedAt:Date.now() };
  try{ await DB.put('inc',i); }catch(e){ toast(writeRefused(e)?"Vous n'avez pas le droit de déclarer un incident.":"Enregistrement impossible, réessayez."); return; }
  INCS.push(i); go({name:'inc', id:i.id, fresh:true});
}

    : '<div class="empty">Aucun incident enregistré.</div>'}`;
  app.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>go({name:'inc', id:b.dataset.inc}));

const MOIS_L=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

const qKey=(y,q)=>`${y}-T${q+1}`;
const qNext=({y,q})=>q===3?{y:y+1,q:0}:{y,q:q+1};
function slotsOf(y,q,dates){ const t=today(), S=planCfg.start||'0000';
  return Object.values(MODS).map(m=>{ const off=planCfg.offset[m.id]??0, mi=q*3+off;
    const mStart=isoD(y,mi,1), mEnd=isoD(y,mi+1,0), qs=isoD(y,q*3,1), qe=isoD(y,q*3+3,0);

function openSignPad(onDone){

  ws.mergeCells('I5:L5'); ws.getCell('I5').value='Avancement';
  const PF={P:'D2E6F7',D:'F8EDBC',C:'E2DBF6',A:'CDEEDF'};
  ['P','D','C','A'].forEach((k,i)=>{ const c=ws.getCell(`${cols[8+i]}6`); c.value=k; c.fill=fill(PF[k]); });
  [5,6].forEach(r=>{ ws.getRow(r).height=20; for(let i=0;i<13;i++){ const c=ws.getCell(`${cols[i]}${r}`); c.font={bold:true,color:{argb:'FF2B2940'}}; c.alignment={vertical:'middle',horizontal:'center',wrapText:true}; c.border=box; if(!c.fill||!c.fill.fgColor) c.fill=fill('EEEEF4'); } });
  list.slice().sort((a,b)=>a.num-b.num).forEach(a=>{
    const row=ws.addRow([a.num, frDate(a.date), a.ligne, a.theme, a.sujet, a.action, a.resp, frDate(a.deadline), a.pdca>0?'X':'', a.pdca>1?'X':'', a.pdca>2?'X':'', a.pdca>3?'X':'', frDate(a.realise)]);
    row.eachCell({includeEmpty:true},(c,n)=>{ c.border=box; c.alignment={vertical:'top',wrapText:true,horizontal:(n<=4||n>=8)?'center':'left'}; });
    row.getCell(1).font={bold:true};
    ['P','D','C','A'].forEach((k,i)=>{ if(a.pdca>i){ const c=row.getCell(9+i); c.fill=fill(PF[k]); c.font={bold:true}; } });
    if(isLate(a)){ const c=row.getCell(8); c.fill=fill('F8D3D1'); c.font={bold:true,color:{argb:'FF9B3833'}}; }
    if(isDone(a)) row.getCell(13).fill=fill('CDEEDF');
  });
  ws.pageSetup.printTitlesRow='5:6';
  return wb.xlsx.writeBuffer();
}

/* ---------------- Changement de module ---------------- */
async function switchMod(id){
  if(MOD.id===id && (actsLoaded||sharedList)) return;
  try{ unsubList&&unsubList(); }catch(e){} try{ unsubActs&&unsubActs(); }catch(e){} try{ unsubIncs&&unsubIncs(); }catch(e){}
  unsubList=null; unsubActs=null; unsubIncs=null;
  MOD=MODS[id]; REF=MOD.ref; ZONES=buildZones(MOD.zones); delete COLL.inc; Object.assign(COLL,MOD.coll);
  sharedList=null; ACTS=[]; actsLoaded=false; INCS=[]; incsLoaded=false; curInc=null; insp=null; curAct=null; photoCache.clear();
  planF={st:'open',z:'all',r:'all'}; try{ planF.r=localStorage.getItem('plan-resp-'+id)||'all'; }catch(e){}
  mem.insp.clear(); mem.photos.clear(); mem.act.clear(); mem.inc.clear();
  try{ idb&&idb.close(); }catch(e){} idb=null; await openDB();
  if(rdb){ await loadOutbox(); subscribeMod(); } else { await loadActsLocal(); await loadIncsLocal(); }
  try{ localStorage.setItem('last-mod',id); }catch(e){}
}
function renderHub(app){
  setBar('Inspections', false); setDock(null); document.title='Inspections — Cognac Embouteillage';
  const card=(m)=>`<button class="mod-card" style="${zc(m.c)}" data-mod="${m.id}"><span class="mod-big-ic">${MOD_IC[m.id]}</span><div><small>${m.ref.code} · v${m.ref.version}</small><h3>${esc(m.short)}</h3><span class="mod-stat" id="ms-${m.id}">Grille, plan d'action, indicateurs et rapports</span></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>`;
  app.innerHTML=`<section class="hero"><div class="hero-top"><div><h2>Inspections</h2><p>Choisissez le type d'inspection à réaliser ou à consulter.</p></div>
    <img class="hero-logo" src="${LOGO}" alt="Logo Cognac Embouteillage"></div></section>
  <div class="mods">${card(MODS.prop)}${card(MODS.log)}${card(MODS.bv)}</div>
  <h3 class="section-title">Planning des inspections</h3>
  <div class="card planning" id="planning"><div class="empty">Chargement du planning…</div></div>`;
  renderPlanning();
  Object.values(MODS).forEach(async m=>{ const st=await modStats(m); const el=$('#ms-'+m.id); if(!el||view.name!=='hub') return;
    const parts=[]; if(st.late) parts.push(`<b class="ms-late">${st.late} action${st.late>1?'s':''} en retard</b>`); if(st.inc) parts.push(`<b class="ms-late">${st.inc} incident${st.inc>1?'s':''} ouvert${st.inc>1?'s':''}</b>`);
    if(st.soon) parts.push(`${st.soon} échéance${st.soon>1?'s':''} sous 7 jours`); if(!parts.length) parts.push(st.open?`${st.open} action${st.open>1?'s':''} en cours, aucune en retard`:'Aucune action en cours');
    el.innerHTML=parts.join(' · '); });
  app.querySelectorAll('[data-mod]').forEach(b=>b.onclick=async()=>{ b.disabled=true; app.innerHTML='<div class="empty" style="padding-top:28px">Chargement…</div>'; await switchMod(b.dataset.mod); go({name:'home'}); });
}
/* ---------------- Démarrage ---------------- */
$('#back').onclick=()=>{ if(view.name==='action') leaveAction(); else if(view.name==='inc') leaveInc(); else if(view.name==='zone'||view.name==='bilan') go({name:'zones'}); else if(view.name==='home') go({name:'hub'}); else go({name:'home'}); };
$('#app').innerHTML='<div class="empty" style="padding-top:28px">Connexion au partage…</div>';
connectShared().then(render);
</script>
